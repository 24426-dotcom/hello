<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VesselAI 선장 - 스마트 선박 진로 플랫폼</title>
  <style>
    body {
      background-color: #0b1325;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      border-bottom: 2px solid #1e293b;
      padding-bottom: 20px;
      margin-bottom: 30px;
      text-align: center;
    }
    h1 { color: #38bdf8; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .section {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .log-item {
      background: #0f172a;
      padding: 15px;
      border-left: 4px solid #38bdf8;
      margin-top: 10px;
      border-radius: 0 6px 6px 0;
    }
    .loading { color: #f59e0b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚢 VesselAI 선장</h1>
      <p>친환경 스마트 선박 시뮬레이터 & 진로 가이드</p>
      <div id="user-status">상태: 하선 중 (로그인 필요)</div>
      <button id="btn-logout" class="hidden" style="width: auto; padding: 5px 10px; background: #ef4444;">하선하기(로그아웃)</button>
    </header>

    <div id="auth-section" class="section">
      <h2>🔐 선장 등록 및 조종실 입장</h2>
      <input type="email" id="auth-email" placeholder="선장 이메일 주소 입력">
      <input type="password" id="auth-password" placeholder="비밀번호 입력">
      <button id="btn-login">조종실 입장 (로그인)</button>
      <button id="btn-register" style="background: #475569;">신규 선장 등록 (회원가입)</button>
    </div>

    <div id="ai-section" class="section hidden">
      <h2>🤖 AI 선교실 (진로 상담 AI)</h2>
      <p>배, 항해사, 조선공학, 자율운항 등 무엇이든 물어보세요!</p>
      <textarea id="ai-question" rows="3" placeholder="예: 자율운항 선박을 제어하는 인공지능 개발자가 되려면 어떤 공부를 해야 하나요?"></textarea>
      <button id="btn-ask-ai">AI 선장에게 질문하기</button>
      
      <div id="ai-response-box" class="hidden" style="margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px;">
        <h3>📋 AI 선장의 브리핑:</h3>
        <p id="ai-text"></p>
        <button id="btn-tts" style="background: #10b981;">📢 음성 브리핑 듣기 (TTS)</button>
      </div>
    </div>

    <div id="logbook-section" class="section hidden">
      <h2>📖 나의 항해일지 (기록실)</h2>
      <button id="btn-refresh-logs" style="background: #4f46e5;">항해일지 불러오기 🔄</button>
      <div id="log-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. ⚠️ 본인의 Firebase 설정값으로 변경하세요
    const firebaseConfig = {
      apiKey: "AIzaSyAVeQVDE6O5AbYdvifAcBUr7xQzI3d5XRI",
      authDomain: "AIzaSyAVeQVDE6O5AbYdvifAcBUr7xQzI3d5XRI",
      projectId: "test-41e69",
      storageBucket: "test-41e69.firebasestorage.app",
      messagingSenderId: "186519965939",
      appId: "1:186519965939:web:dabad0f0350175ab97e786"
    };

    // 2. ⚠️ 구글 AI 스튜디오에서 발급받은 Gemini API 키를 넣으세요
    const GEMINI_API_KEY = "AIzaSyD4FOeK9UO9--d807XkHmedLqSQqwVAv8o"; 

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM 요소
    const authSection = document.getElementById('auth-section');
    const aiSection = document.getElementById('ai-section');
    const logbookSection = document.getElementById('logbook-section');
    const userStatus = document.getElementById('user-status');
    const btnLogout = document.getElementById('btn-logout');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const aiQuestion = document.getElementById('ai-question');
    const aiResponseBox = document.getElementById('ai-response-box');
    const aiText = document.getElementById('ai-text');
    const logList = document.getElementById('log-list');

    // [회원가입]
    document.getElementById('btn-register').addEventListener('click', async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        alert("선장 등록 완료!");
      } catch (e) { alert("등록 실패: " + e.message); }
    });

    // [로그인]
    document.getElementById('btn-login').addEventListener('click', async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        alert("조종실 입장 완료!");
      } catch (e) { alert("입장 실패: " + e.message); }
    });

    // [로그아웃]
    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
      alert("하선하셨습니다.");
      aiResponseBox.classList.add('hidden');
    });

    // [인증 상태 감시]
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userStatus.innerText = `상태: ${user.email} 선장님 승선 중`;
        authSection.classList.add('hidden');
        aiSection.classList.remove('hidden');
        logbookSection.classList.remove('hidden');
        btnLogout.classList.remove('hidden');
        loadLogbook();
      } else {
        userStatus.innerText = "상태: 하선 중 (로그인 필요)";
        authSection.classList.remove('hidden');
        aiSection.classList.add('hidden');
        logbookSection.classList.add('hidden');
        btnLogout.classList.add('hidden');
      }
    });

    // [실제 Gemini AI API 호출 및 연동]
    document.getElementById('btn-ask-ai').addEventListener('click', async () => {
      const question = aiQuestion.value.trim();
      if (!question) return alert("질문을 입력하세요!");

      aiText.innerHTML = "<span class='loading'>🚢 AI 선장이 항로를 분석하며 브리핑을 작성 중입니다...</span>";
      aiResponseBox.classList.remove('hidden');

      // AI에게 부여할 든든한 페르소나 주입
      const systemPrompt = "너는 30년 경력의 베테랑 선장이자 스마트 친환경 선박 설계 전문가야. 배를 좋아하는 학생들에게 자율운항 기술, 수소/LNG 친환경 선박 기술, 그리고 항해사 및 조선공학자가 되는 진로를 전문적이면서도 친절하게 격려하며 존댓말로 설명해줘. 대답은 간결하고 명확하게 핵심만 말해줘. 질문: ";

      try {
        // 구글 Gemini API 호출 (gemini-pro 모델 활용)
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt + question }] }]
          })
        });

        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;
        
        // 화면에 AI 답변 출력
        aiText.innerText = aiResponse;

        // Firestore에 자동 저장 호출
        await saveToLogbook(question, aiResponse);

      } catch (error) {
        aiText.innerText = "통신 실패 혹은 API 키 오류가 발생했습니다: " + error.message;
      }
    });

    // [TTS 음성 출력]
    document.getElementById('btn-tts').addEventListener('click', () => {
      const text = aiText.innerText;
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.95; // 듬직한 선장 느낌의 약간 느린 말투
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    });

    // [Firestore DB 데이터 저장]
    async function saveToLogbook(question, aiResponse) {
      const user = auth.currentUser;
      if (!user) return;
      try {
        await addDoc(collection(db, "logbooks"), {
          captainId: user.uid,
          question: question,
          aiResponse: aiResponse,
          createdAt: serverTimestamp()
        });
        loadLogbook(); // 저장 후 목록 새로고침
      } catch (e) { console.error("일지 작성 실패: ", e); }
    }

    // [Firestore DB 데이터 불러오기]
    async function loadLogbook() {
      const user = auth.currentUser;
      if (!user) return;
      logList.innerHTML = "일지를 불러오는 중...";
      try {
        const q = query(collection(db, "logbooks"), where("captainId", "==", user.uid));
        const querySnapshot = await getDocs(q);
        logList.innerHTML = "";
        if (querySnapshot.empty) {
          logList.innerHTML = "<p>작성된 항해일지가 없습니다. 첫 질문을 시작하세요!</p>";
          return;
        }
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const logItem = document.createElement('div');
          logItem.className = 'log-item';
          logItem.innerHTML = `<p><strong>⚓ 질문:</strong> ${data.question}</p><p><strong>🤖 AI 브리핑:</strong> ${data.aiResponse}</p>`;
          logList.appendChild(logItem);
        });
      } catch (e) { logList.innerHTML = "불러오기 실패: " + e.message; }
    }

    document.getElementById('btn-refresh-logs').addEventListener('click', loadLogbook);
  </script>
</body>
</html>
